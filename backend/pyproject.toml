[project]
name = "dreamthread-backend"
version = "0.1.0"
description = "DreamThread API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
  "openai>=1.60,<3",
  "certifi>=2024.2.2,<2027",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
