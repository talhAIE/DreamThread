# Application containers connect to hosted Neon. No local PostgreSQL service or volume.
x-runtime-environment: &runtime_environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:?Configure the restricted Neon runtime URL in .env}
  EXPECTED_SCHEMA_REVISION: ${EXPECTED_SCHEMA_REVISION:-0009_continuity_search_index}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
  QUEUE_POOL_SIZE: ${QUEUE_POOL_SIZE:-1}
  DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-20}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-15}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
  NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  NEBIUS_EXTRACTION_MODEL: ${NEBIUS_EXTRACTION_MODEL:-}
  NEBIUS_REASONING_MODEL: ${NEBIUS_REASONING_MODEL:-}
  NEBIUS_EMBEDDING_MODEL: ${NEBIUS_EMBEDDING_MODEL:-}
  NEBIUS_OUTPUT_MODE: ${NEBIUS_OUTPUT_MODE:-json_object}
  PROMPT_VERSION: ${PROMPT_VERSION:-v2}
  EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
  EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX-}
  EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX-}
  EMBEDDING_PREFIXES_VERIFIED: ${EMBEDDING_PREFIXES_VERIFIED:-false}
  EMBEDDING_INPUT_TOKEN_BUDGET: ${EMBEDDING_INPUT_TOKEN_BUDGET:-2048}
  EMBEDDING_BATCH_BYTE_BUDGET: ${EMBEDDING_BATCH_BYTE_BUDGET:-32768}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-2048}
  MODEL_CONTEXT_TOKEN_BUDGET: ${MODEL_CONTEXT_TOKEN_BUDGET:-32768}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-20}
  JOB_STAGE_TIMEOUT_SECONDS: ${JOB_STAGE_TIMEOUT_SECONDS:-90}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
  JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-2}
  JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-60}
  WORKER_MAINTENANCE_SECONDS: ${WORKER_MAINTENANCE_SECONDS:-30}
  WORKER_SHUTDOWN_SECONDS: ${WORKER_SHUTDOWN_SECONDS:-10}
  CHECKPOINT_RETENTION_DAYS: ${CHECKPOINT_RETENTION_DAYS:-7}
  AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
  ANONYMOUS_AI_DAILY_LIMIT: ${ANONYMOUS_AI_DAILY_LIMIT:-5}
  DEMO_ENABLED: ${DEMO_ENABLED:-false}

services:
  api:
    build: .
    environment:
      <<: *runtime_environment
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-5}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-131072}
      USER_REQUEST_RATE_LIMIT: ${USER_REQUEST_RATE_LIMIT:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build: .
    command: ["/srv/.venv/bin/python", "-m", "app.workers.main"]
    environment:
      <<: *runtime_environment
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?Configure the restricted Neon queue URL in .env}
      # Required by production Settings; this worker does not validate HTTP tokens.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    healthcheck:
      disable: true # Monitor process and job age; worker has no HTTP listener.
    restart: unless-stopped
