x-inference-environment: &inference_environment
  NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  NEBIUS_EXTRACTION_MODEL: ${NEBIUS_EXTRACTION_MODEL:-}
  NEBIUS_REASONING_MODEL: ${NEBIUS_REASONING_MODEL:-}
  NEBIUS_EMBEDDING_MODEL: ${NEBIUS_EMBEDDING_MODEL:-}
  NEBIUS_OUTPUT_MODE: ${NEBIUS_OUTPUT_MODE:-json_object}
  PROMPT_VERSION: ${PROMPT_VERSION:-v1}
  EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
  EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX-}
  EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX-}
  EMBEDDING_PREFIXES_VERIFIED: ${EMBEDDING_PREFIXES_VERIFIED:-false}
  EMBEDDING_INPUT_TOKEN_BUDGET: ${EMBEDDING_INPUT_TOKEN_BUDGET:-2048}
  EMBEDDING_BATCH_BYTE_BUDGET: ${EMBEDDING_BATCH_BYTE_BUDGET:-32768}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-2048}
  MODEL_CONTEXT_TOKEN_BUDGET: ${MODEL_CONTEXT_TOKEN_BUDGET:-32768}

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: dreamthread
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dreamthread
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dreamthread_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamthread -d dreamthread"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      <<: *inference_environment
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://dreamthread_app:local-runtime-only@db:5432/dreamthread
      EXPECTED_SCHEMA_REVISION: 0005_embedding_spaces
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["/srv/.venv/bin/python", "-m", "app.workers.main"]
    environment:
      <<: *inference_environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://dreamthread_app:local-runtime-only@db:5432/dreamthread
      QUEUE_DATABASE_URL: postgresql+psycopg://dreamthread_claimer:local-queue-only@db:5432/dreamthread
      EXPECTED_SCHEMA_REVISION: 0005_embedding_spaces
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
    healthcheck:
      disable: true # Worker has no HTTP listener; monitor process and job age.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  dreamthread_pgdata:
